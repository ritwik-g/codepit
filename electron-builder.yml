appId: com.ritwikg.codepit
productName: CodePit
copyright: Ritwik G

directories:
  output: release
  buildResources: build

# The bundled main process and agent scripts, the built renderer, and the
# manifest. The server is bundled INTO main.mjs, so server/ itself is not
# shipped. Production dependencies are added by electron-builder on its own:
# the agent packages need them at runtime.
files:
  - dist-electron/**
  - dist/**
  - package.json
  - '!**/*.map'

# Everything an agent process touches must be a real file, because nothing inside
# app.asar can be executed and a script run from outside it cannot resolve
# modules inside it:
#  - node-pty: its .node binary and spawn-helper (else "posix_spawnp failed").
#  - the agent scripts: run on the app's executable in Node mode.
#  - node_modules: the agent packages and everything they load, including the
#    native claude and codex binaries they spawn. Unpacking the whole tree keeps
#    that working as their dependencies change, rather than tracking them here.
asarUnpack:
  - 'dist-electron/agents/**'
  - '**/node_modules/**'

# Each artifact names its own architecture, so the two macOS builds can live
# side by side on one release without colliding.
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

mac:
  category: public.app-category.developer-tools
  # No arch pinned: each build produces its host's architecture.
  target:
    - dmg
    - zip
  icon: build/icon.icns
  # Unsigned: no Developer ID here. Hardened runtime without a signature just
  # makes Gatekeeper louder, so leave it off and document the xattr step.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  extendInfo:
    NSSupportsAutomaticGraphicsSwitching: true

dmg:
  title: CodePit
  # Must be a REAL file, not null: with a custom `contents` layout dmgbuild
  # always installs a background, and electron-builder's built-in one fails on
  # GitHub's macOS runners.
  background: build/background.png
  writeUpdateInfo: false
  # The /Applications drag target.
  contents:
    - x: 150
      y: 180
      type: file
    - x: 390
      y: 180
      type: link
      path: /Applications

linux:
  category: Development
  target:
    - AppImage
  icon: build/icon.png
  synopsis: A pit wall for your coding agents
  desktop:
    entry:
      Terminal: 'false'
      Type: Application

# node-pty 1.1 is an N-API module: its prebuilds (darwin, win32) load in Electron
# as they are, so there is nothing to rebuild on macOS. Linux has no prebuild;
# `npm run dist:linux` runs rebuild:electron first.
npmRebuild: false
