<!--
  CodePit app icon for 16 and 32 px: the pit board from icon.svg, square-on and
  without the pole or chequer, so the ">_" survives at a handful of pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22242c"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a97ff"/>
      <stop offset="1" stop-color="#5563ee"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="176" y="256" width="672" height="512" rx="60" fill="url(#frame)"/>
  <rect x="234" y="314" width="556" height="396" rx="22" fill="#0b0c10"/>
  <path d="M326 392 L444 488 L326 584" fill="none" stroke="#ffffff" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 604 H686" fill="none" stroke="#ffffff" stroke-width="84" stroke-linecap="round"/>
</svg>
